# Render Blueprint: New > Blueprint > pick this repo. Free plan sleeps after ~15 min idle (first request is slow).
services:
  - type: web
    name: pipedrive-ops-mcp
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MCP_AUTH_TOKEN
        generateValue: true      # Render creates a random secret; copy it into n8n / Claude Code
      - key: PIPEDRIVE_API_TOKEN
        sync: false              # you paste this in the Render dashboard; it is never stored in git
      - key: ALLOW_WRITES
        value: "false"
